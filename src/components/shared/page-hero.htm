<!-- =========================
Inner-page hero.

Props (all required, the injector leaves the literal token behind
if one is omitted):
  eyebrow  short kicker text
  title    heading; may contain inline HTML (use single quotes)
  lead     supporting paragraph
  accent   hex used for the orb + eyebrow dot
===========================-->
<section class="page-hero">
  <span class="grid-field" aria-hidden="true"></span>
  <span class="orb -top-28 left-[12%] size-[400px] animate-drift" style="--orb: {=$accent}; --orb-opacity: 0.3" aria-hidden="true"></span>
  <span class="orb top-1/4 -right-20 size-[360px] animate-drift-slow" style="--orb: #ff6b35; --orb-opacity: 0.2" aria-hidden="true"></span>

  <div class="main-container relative z-10">
    <div class="mx-auto max-w-3xl text-center">
      <p data-reveal class="eyebrow-chip mb-6">
        <span class="pulse-dot" style="--dot: {=$accent}"></span>
        {=$eyebrow}
      </p>
      <h1 data-reveal class="text-heading-4 sm:text-heading-3 lg:text-heading-2 font-semibold tracking-tight text-secondary">
        {=$title}
      </h1>
      <p data-reveal class="text-tagline-1 mx-auto mt-5 max-w-2xl text-secondary/60 md:text-lg">
        {=$lead}
      </p>
    </div>
  </div>
</section>
