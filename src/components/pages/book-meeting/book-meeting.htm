<!-- Include Calendly Widget Scripts -->
<script type="text/javascript" src="https://assets.calendly.com/assets/external/widget.js" async></script>

<!-- Embedded Script to dynamically style & retheme Calendly depending on light/dark mode -->
<script type="text/javascript">
  (function() {
    let calendlyInitialized = false;
    let currentTheme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';

    function getThemeColors(theme) {
      if (theme === 'dark') {
        return {
          backgroundColor: '0f1217', // bg-background-6
          textColor: 'fcfcfc',       // text-accent
          primaryColor: '864ffe'     // primary-500
        };
      } else {
        return {
          backgroundColor: 'ffffff', // white
          textColor: '1a1a1c',       // text-secondary
          primaryColor: '864ffe'     // primary-500
        };
      }
    }

    function initOrUpdateCalendly() {
      if (typeof Calendly === 'undefined') {
        // Retry shortly if widget script hasn't finished loading yet
        setTimeout(initOrUpdateCalendly, 100);
        return;
      }

      const container = document.getElementById('calendly-embed-container');
      if (!container) return;

      // Clear current content
      container.innerHTML = '';

      const colors = getThemeColors(currentTheme);
      
      Calendly.initInlineWidget({
        url: 'https://calendly.com/ahmadbajwa3095?hide_landing_page_details=1&hide_gdpr_banner=1',
        parentElement: container,
        prefill: {},
        pageSettings: {
          backgroundColor: colors.backgroundColor,
          primaryColor: colors.primaryColor,
          textColor: colors.textColor
        }
      });
      
      calendlyInitialized = true;
    }

    // Run once DOM is fully loaded or active
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      initOrUpdateCalendly();
    } else {
      window.addEventListener('DOMContentLoaded', initOrUpdateCalendly);
    }

    // Monitor for HTML element class changes (theme switching) and re-render Calendly dynamically
    const observer = new MutationObserver(function(mutations) {
      mutations.forEach(function(mutation) {
        if (mutation.attributeName === 'class' && calendlyInitialized) {
          const newTheme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
          if (newTheme !== currentTheme) {
            currentTheme = newTheme;
            initOrUpdateCalendly();
          }
        }
      });
    });

    observer.observe(document.documentElement, {
      attributes: true,
      attributeFilter: ['class']
    });
  })();
</script>
