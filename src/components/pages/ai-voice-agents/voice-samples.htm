<!-- voice samples section -->
<section class="pt-[85px] pb-[100px] lg:pt-[112px] lg:pb-[150px] bg-background-2 dark:bg-background-9"
  aria-labelledby="voice-samples-heading" itemscope itemtype="https://schema.org/ItemList">
  <div class="main-container">
    <div class="space-y-12 md:space-y-16">
      <!-- header content  -->
      <div class="space-y-4 text-center">
        <span data-ns-animate data-delay="0.1" class="badge badge-green-v2" aria-label="Voice Samples section badge"
          itemprop="name">
          Interactive Voice Library
        </span>
        <div class="space-y-3">
          <h2 id="voice-samples-heading" data-ns-animate data-delay="0.2"
            class="font-bold text-secondary dark:text-white" itemprop="name">
            Experience the <span class="text-primary-500">conversational realism</span>
          </h2>
          <p data-ns-animate data-delay="0.3"
            class="text-secondary/70 dark:text-accent/70 mx-auto max-w-[550px] text-base" itemprop="description">
            Click play on any agent to hear their conversational flow, natural pacing, and regional accents.
          </p>
        </div>
      </div>

      <!-- samples collections  -->
      <div
        class="grid grid-cols-1 items-center justify-center gap-6 md:grid-cols-2 lg:grid-cols-3 max-w-[1200px] mx-auto">
        <!-- item one  -->
        <Component src="src/components/pages/ai-voice-agents/voice-sample-item.htm" img-link="./images/ns-avatar-01.png"
          name="Sarah Miller" description="US Female - Sales & Growth Agent"
          audio-path="./audio/sarah.mp3" delay="0.1" />
        <!-- item two  -->
        <Component src="src/components/pages/ai-voice-agents/voice-sample-item.htm" img-link="./images/ns-avatar-1.png"
          name="David Chen" description="US Male - Customer Support Specialist"
          audio-path="./audio/david.mp3" delay="0.2" />
        <!-- item three  -->
        <Component src="src/components/pages/ai-voice-agents/voice-sample-item.htm" img-link="./images/ns-avatar-02.png"
          name="Elena Rostova" description="UK Female - Multilingual Receptionist"
          audio-path="./audio/elena.mp3" delay="0.3" />
        <!-- item four  -->
        <Component src="src/components/pages/ai-voice-agents/voice-sample-item.htm" img-link="./images/ns-avatar-7.png"
          name="James Sterling" description="US Male - Appointment Scheduler"
          audio-path="./audio/james.mp3" delay="0.4" />
        <!-- item five  -->
        <Component src="src/components/pages/ai-voice-agents/voice-sample-item.htm" img-link="./images/ns-avatar-01.png"
          name="Aiko Tanaka" description="Japanese Female - Billing & Account Rep"
          audio-path="./audio/aiko.mp3" delay="0.5" />
        <!-- item six  -->
        <Component src="src/components/pages/ai-voice-agents/voice-sample-item.htm" img-link="./images/ns-avatar-5.png"
          name="Marcus Vance" description="Aus Male - Collections & Support Agent"
          audio-path="./audio/marcus.mp3" delay="0.6" />
      </div>
    </div>
  </div>
</section>
