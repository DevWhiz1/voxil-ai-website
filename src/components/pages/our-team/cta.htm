<section class="bg-background-2 dark:bg-background-6 pt-[120px] pb-[100px] lg:pb-[200px]">
  <div class="main-container">
    <div class="">
      <div class="space-y-3 text-center">
        <span data-ns-animate data-delay="0.1" class="badge badge-cyan mb-5 inline-block"
          >Get started</span
        >
        <h2 data-ns-animate data-delay="0.2" id="newsletter-heading" class="mx-auto max-w-[1042px]">
          Voxil Ai  – your ultimate email & transactional messaging platform
        </h2>
        <p data-ns-animate data-delay="0.3" class="mx-auto max-w-[600px]">
          Drive more engagement. improve deliverability. automate your emails.
        </p>
      </div>

      <div class="mt-[62px] space-y-8 max-sm:mx-auto max-sm:w-[80%]">
        <form
          data-ns-animate
          data-delay="0.4"
          action="#"
          method="post"
          class="flex items-center justify-center gap-3 max-sm:flex-col"
        >
          <input
            type="email"
            name="email"
            id="userEmail"
            placeholder="Enter your email"
            required
            class="shadow-1 placeholder:text-secondary/50 border-stroke-1 dark:bg-background-6 text-secondary/60 dark:bg-dark-200 focus:border-primary-500 dark:focus:border-primary-500 focus:ring-primary-500/20 h-12 w-full max-w-[440px] rounded-full border px-[18px] py-3 font-normal placeholder:font-normal focus:ring-2 focus:outline-none dark:border-[#31332F] dark:text-white/60 dark:placeholder:text-white/40"
          />
          <button
            type="submit"
            class="btn btn-md btn-primary border-primary-400 hover:btn-secondary dark:hover:btn-accent h-12 max-sm:w-full"
          >
            <span>Get started</span>
          </button>
        </form>

        <!-- Trial copy removed for agency model -->
      </div>
    </div>
  </div>
</section>
