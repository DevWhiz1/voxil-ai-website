<!-- =========================
Contact
===========================-->
<section class="pt-32 pb-14 sm:pt-36 md:pt-42 md:pb-16 lg:pb-20 xl:pt-[180px] xl:pb-[100px]"
  aria-label="Contact Information and Form">
  <div class="main-container">
    <div class="space-y-[70px]">
      <!-- heading  -->
      <div class="mx-auto max-w-[680px] space-y-3 text-center">
        <h2 data-ns-animate data-delay="0.2">Let's build something extraordinary together.</h2>
        <p data-ns-animate data-delay="0.3">
          Got an AI project in mind? Whether you need a custom agent, SaaS platform, or workflow automation — our team
          is ready to bring your vision to life. Reach out and let's start the conversation.
        </p>
      </div>

      <div class="flex flex-col items-center justify-center gap-10 lg:flex-row lg:items-start lg:gap-8 xl:gap-[70px]">
        <!-- contact info cards  -->
        <div data-ns-animate data-delay="0.4" class="flex flex-col gap-8 md:flex-row lg:flex-col">
          <!-- contact info one  -->
          <div
            class="bg-secondary dark:bg-background-6 relative w-full space-y-6 overflow-hidden rounded-[20px] p-11 text-center md:max-w-[371px]">
            <!-- bg overlay  -->
            <figure
              class="pointer-events-none absolute top-[-187px] left-[174px] size-[350px] -rotate-[78deg] overflow-hidden select-none">
              <img src="./images/ns-img-510.png" alt="Decorative gradient overlay" class="size-full object-cover" />
            </figure>
            <figure class="mx-auto size-10 overflow-hidden">
              <img src="./images/icons/home.svg" alt="Office location icon" class="size-full object-cover" />
            </figure>

            <div class="space-y-2.5">
              <p class="text-heading-6 text-accent">Our Office</p>
              <p class="text-accent/60">United States</p>
            </div>
          </div>

          <!-- contact info two  -->
          <div
            class="card-item bg-secondary dark:bg-background-6 relative w-full overflow-hidden rounded-[20px] p-11 text-center md:max-w-[371px]">
            <!-- bg overlay  -->
            <figure
              class="pointer-events-none absolute top-[-206px] left-[-36px] size-[350px] rotate-[62deg] overflow-hidden select-none">
              <img src="./images/ns-img-509.png" alt="Decorative gradient overlay" class="size-full object-cover" />
            </figure>

            <div class="space-y-6">
              <figure class="mx-auto size-10 overflow-hidden">
                <img src="./images/icons/mail-open.svg" alt="Email icon" class="size-full object-cover" />
              </figure>

              <div class="space-y-2.5">
                <p class="text-heading-6 text-accent">Email Us</p>
                <p class="text-accent/60">
                  <a href="mailto:info@voxilai.tech">info@voxilai.tech</a>
                </p>
              </div>
            </div>
          </div>

          <!-- contact info three  -->
          <!-- <div
            class="bg-secondary dark:bg-background-6 relative w-full overflow-hidden rounded-[20px] p-11 text-center md:max-w-[371px]">
                      <figure class="pointer-events-none absolute top-[-264px] left-[-255px] size-[450px] select-none">
              <img src="./images/ns-img-498.png" alt="Decorative gradient overlay" />
            </figure>

            <div class="space-y-6">
              <figure class="mx-auto size-10 overflow-hidden">
                <img src="./images/icons/phone-right.svg" alt="Phone icon" class="size-full object-cover" />
              </figure>

              <div class="space-y-2.5">
                <p class="text-heading-6 text-accent">Call Us</p>
                <p class="text-accent/60">
                  <a href="tel:+15052345678">+92 3407005883</a>
                </p>
              </div>
            </div>
          </div> -->
        </div>

        <!-- contact form  -->
        <div data-ns-animate data-delay="0.3"
          class="dark:bg-background-6 mx-auto w-full max-w-[847px] rounded-4xl bg-white p-6 md:p-8 lg:p-11">
          <form id="contact-form" class="space-y-8" novalidate>
            <!-- name and company  -->
            <div class="flex flex-col items-center justify-between gap-8 md:flex-row">
              <!--  full name -->
              <div class="w-full space-y-2 lg:max-w-[364px]">
                <label for="fullname" class="text-tagline-2 text-secondary dark:text-accent block font-medium">Full name
                  <span class="text-ns-red">*</span></label>
                <input type="text" id="fullname" name="fullname" placeholder="John Doe" required autocomplete="name"
                  class="dark:focus-visible:border-stroke-4/20 dark:border-stroke-7 dark:bg-background-6 border-stroke-3 bg-background-1 text-tagline-2 placeholder:text-secondary/60 focus:border-secondary placeholder:text-tagline-2 dark:placeholder:text-accent/60 dark:text-accent h-[48px] w-full rounded-full border px-[18px] py-3 font-normal placeholder:font-normal focus:outline-none xl:h-[41px]" />
                <span class="field-error hidden text-xs text-red-500 mt-1 block"></span>
              </div>

              <!-- company name -->
              <div class="w-full max-w-[364px] space-y-2">
                <label for="company" class="text-tagline-2 text-secondary dark:text-accent block font-medium">Company
                  name <span class="text-ns-red">*</span></label>
                <input type="text" id="company" name="company" placeholder="Acme Inc." required
                  autocomplete="organization"
                  class="dark:focus-visible:border-stroke-4/20 dark:border-stroke-7 dark:bg-background-6 border-stroke-3 bg-background-1 text-tagline-2 placeholder:text-secondary/60 focus:border-secondary placeholder:text-tagline-2 dark:placeholder:text-accent/60 dark:text-accent h-[48px] w-full rounded-full border px-[18px] py-3 font-normal placeholder:font-normal focus:outline-none xl:h-[41px]" />
                <span class="field-error hidden text-xs text-red-500 mt-1 block"></span>
              </div>
            </div>

            <!-- email and phone  -->
            <div class="flex flex-col items-center justify-between gap-8 md:flex-row">
              <!-- email  -->
              <div class="w-full space-y-2 lg:max-w-[364px]">
                <label for="email" class="text-tagline-2 text-secondary dark:text-accent block font-medium">Work email
                  <span class="text-ns-red">*</span></label>
                <input type="email" id="email" name="email" placeholder="john@company.com" required autocomplete="email"
                  class="dark:focus-visible:border-stroke-4/20 dark:border-stroke-7 dark:bg-background-6 border-stroke-3 bg-background-1 text-tagline-2 placeholder:text-secondary/60 focus:border-secondary placeholder:text-tagline-2 dark:placeholder:text-accent/60 dark:text-accent h-[48px] w-full rounded-full border px-[18px] py-3 font-normal placeholder:font-normal focus:outline-none xl:h-[41px]" />
                <span class="field-error hidden text-xs text-red-500 mt-1 block"></span>
              </div>

              <!-- phone number -->
              <div class="w-full max-w-[364px] space-y-2">
                <label for="phone" class="text-tagline-2 text-secondary dark:text-accent block font-medium">Phone
                  number</label>
                <input type="tel" id="phone" name="phone" placeholder="+1 (555) 000-0000" autocomplete="tel"
                  class="dark:focus-visible:border-stroke-4/20 dark:border-stroke-7 dark:bg-background-6 border-stroke-3 bg-background-1 text-tagline-2 placeholder:text-secondary/60 focus:border-secondary placeholder:text-tagline-2 dark:placeholder:text-accent/60 dark:text-accent h-[48px] w-full rounded-full border px-[18px] py-3 font-normal placeholder:font-normal focus:outline-none xl:h-[41px]" />
                <span class="field-error hidden text-xs text-red-500 mt-1 block"></span>
              </div>
            </div>

            <!-- service interest  -->
            <div class="space-y-2">
              <label for="service" class="text-tagline-2 text-secondary dark:text-accent block font-medium">Service
                you're interested in <span class="text-ns-red">*</span></label>
              <select id="service" name="service" required
                class="dark:focus-visible:border-stroke-4/20 dark:border-stroke-7 dark:bg-background-6 border-stroke-3 bg-background-1 text-tagline-2 placeholder:text-secondary/60 focus:border-secondary placeholder:text-tagline-2 dark:placeholder:text-accent/60 dark:text-accent h-[48px] w-full rounded-full border px-[18px] py-3 font-normal placeholder:font-normal focus:outline-none xl:h-[41px] appearance-none cursor-pointer">
                <option value="" disabled selected>Select a service</option>
                <option value="ai-automation">AI Automation & Workflow Optimization</option>
                <option value="ai-agents">Custom AI Agents</option>
                <option value="ai-saas">AI-Powered SaaS Development</option>
                <option value="web-development">Web Development & AI Integration</option>
                <option value="consulting">AI Consulting & Strategy</option>
                <option value="other">Other / Not sure yet</option>
              </select>
              <span class="field-error hidden text-xs text-red-500 mt-1 block"></span>
            </div>

            <!-- budget range  -->
            <div class="space-y-2">
              <label for="budget" class="text-tagline-2 text-secondary dark:text-accent block font-medium">Estimated
                budget range</label>
              <select id="budget" name="budget"
                class="dark:focus-visible:border-stroke-4/20 dark:border-stroke-7 dark:bg-background-6 border-stroke-3 bg-background-1 text-tagline-2 placeholder:text-secondary/60 focus:border-secondary placeholder:text-tagline-2 dark:placeholder:text-accent/60 dark:text-accent h-[48px] w-full rounded-full border px-[18px] py-3 font-normal placeholder:font-normal focus:outline-none xl:h-[41px] appearance-none cursor-pointer">
                <option value="" disabled selected>Select budget range</option>
                <option value="under-5k">Under $5,000</option>
                <option value="5k-15k">$5,000 – $15,000</option>
                <option value="15k-50k">$15,000 – $50,000</option>
                <option value="50k-plus">$50,000+</option>
                <option value="not-sure">Not sure yet</option>
              </select>
            </div>

            <!-- project timeline  -->
            <div class="space-y-2">
              <label for="timeline" class="text-tagline-2 text-secondary dark:text-accent block font-medium">Expected
                timeline</label>
              <select id="timeline" name="timeline"
                class="dark:focus-visible:border-stroke-4/20 dark:border-stroke-7 dark:bg-background-6 border-stroke-3 bg-background-1 text-tagline-2 placeholder:text-secondary/60 focus:border-secondary placeholder:text-tagline-2 dark:placeholder:text-accent/60 dark:text-accent h-[48px] w-full rounded-full border px-[18px] py-3 font-normal placeholder:font-normal focus:outline-none xl:h-[41px] appearance-none cursor-pointer">
                <option value="" disabled selected>Select timeline</option>
                <option value="urgent">ASAP / Urgent</option>
                <option value="1-month">Within 1 month</option>
                <option value="1-3-months">1 – 3 months</option>
                <option value="3-6-months">3 – 6 months</option>
                <option value="flexible">Flexible / Exploring</option>
              </select>
            </div>

            <!-- how did you hear  -->
            <div class="space-y-2">
              <label for="source" class="text-tagline-2 text-secondary dark:text-accent block font-medium">How did you
                hear about Voxil Ai ?</label>
              <select id="source" name="source"
                class="dark:focus-visible:border-stroke-4/20 dark:border-stroke-7 dark:bg-background-6 border-stroke-3 bg-background-1 text-tagline-2 placeholder:text-secondary/60 focus:border-secondary placeholder:text-tagline-2 dark:placeholder:text-accent/60 dark:text-accent h-[48px] w-full rounded-full border px-[18px] py-3 font-normal placeholder:font-normal focus:outline-none xl:h-[41px] appearance-none cursor-pointer">
                <option value="" disabled selected>Select an option</option>
                <option value="google">Google Search</option>
                <option value="linkedin">LinkedIn</option>
                <option value="referral">Referral / Word of Mouth</option>
                <option value="social-media">Social Media</option>
                <option value="event">Conference / Event</option>
                <option value="other">Other</option>
              </select>
            </div>

            <!-- message -->
            <div class="space-y-2">
              <label for="message" class="text-tagline-2 text-secondary dark:text-accent block font-medium">Tell us
                about your project <span class="text-ns-red">*</span></label>
              <textarea id="message" name="message" rows="6"
                placeholder="Describe your project, goals, and any specific requirements..." required
                class="dark:bg-background-6 dark:border-stroke-7 border-stroke-3 bg-background-1 text-tagline-2 placeholder:text-secondary/60 focus:border-secondary dark:focus-visible:border-stroke-4/20 placeholder:text-tagline-2 dark:placeholder:text-accent/60 dark:text-accent w-full rounded-xl border px-[18px] py-3 font-normal placeholder:font-normal focus:outline-none"></textarea>
              <span class="field-error hidden text-xs text-red-500 mt-1 block"></span>
            </div>

            <!-- terms checkbox -->
            <fieldset class="mb-4 flex items-center gap-2">
              <label for="terms" class="flex items-center gap-x-3">
                <input id="terms" type="checkbox" class="peer sr-only" required />
                <span
                  class="border-stroke-3 dark:border-stroke-7 after:bg-primary-500 peer-checked:border-primary-500 relative size-4 cursor-pointer rounded-full border after:absolute after:top-1/2 after:left-1/2 after:size-2.5 after:-translate-x-1/2 after:-translate-y-1/2 after:rounded-full after:opacity-0 peer-checked:after:opacity-100"></span>
              </label>
              <label for="terms" class="text-tagline-3 text-secondary/60 dark:text-accent/60 cursor-pointer">
                I agree to the
                <a href="./privacy-policy.html" class="text-primary-500 text-tagline-3 underline">privacy policy</a>
                and
                <a href="./terms-conditions.html" class="text-primary-500 text-tagline-3 underline">terms of service</a>
              </label>
            </fieldset>

            <!-- form status message -->
            <div id="form-status-message"
              class="hidden rounded-xl border px-5 py-3 text-sm font-medium transition-all duration-300"></div>

            <!-- submit button -->
            <button type="submit"
              class="btn btn-md btn-secondary hover:btn-primary dark:btn-accent w-full first-letter:uppercase before:content-none">
              Send message
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
